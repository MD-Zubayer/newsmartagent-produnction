name: "🚀 Blue-Green Docker Deploy"

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: "Deploy with Zero Downtime"
    runs-on: self-hosted

    steps:
      - name: "🔓 Fix Permissions for Cleanup"
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }} || true
          sudo chmod -R 777 ${{ github.workspace }} || true
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔧 Fix Config & Service Account Setup"
        run: |
          echo "🔍 Validating gdrive_key.json structure..."
          
          # ডিরেক্টরি যদি থাকে তবে সরিয়ে দিন
          if [ -d "jwtauth/gdrive_key.json" ]; then
            echo "⚠️  Found gdrive_key.json as directory, removing it..."
            sudo rm -rf jwtauth/gdrive_key.json
            echo "✅ Removed gdrive_key.json directory"
          fi
          
          # কনফিগ ডিরেক্টরি তৈরি করুন
          mkdir -p /home/ubuntu/configs
          
          # service_account.json কপি করুন
          if [ -d "$HOME/service_account.json" ]; then
            echo "⚠️  Found $HOME/service_account.json as a directory, expected a JSON file"
            json_files=$(find "$HOME/service_account.json" -maxdepth 1 -type f -name '*.json' | sort)
            if [ -n "$json_files" ]; then
              echo "ℹ️  JSON file(s) found inside the directory:"
              echo "$json_files"
              if [ "$(echo "$json_files" | wc -l)" -eq 1 ]; then
                cp "$(echo "$json_files" | head -n 1)" /home/ubuntu/configs/service_account.json
                echo "✅ Copied JSON file from directory to /home/ubuntu/configs/service_account.json"
              else
                echo "🚨 Multiple JSON files found inside $HOME/service_account.json; cannot determine which one to use"
                exit 1
              fi
            else
              echo "🚨 No JSON files found inside $HOME/service_account.json"
              exit 1
            fi
          elif [ -f "$HOME/service_account.json" ]; then
            cp "$HOME/service_account.json" /home/ubuntu/configs/service_account.json
            echo "✅ Service account copied to /home/ubuntu/configs/"
            
            # ফাইল ভ্যালিডেশন
            if file /home/ubuntu/configs/service_account.json | grep -q "JSON"; then
              echo "✅ Service account is valid JSON file"
            else
              echo "⚠️  Warning: Service account may not be valid JSON"
            fi
          else
            echo "⚠️  Warning: $HOME/service_account.json not found, using existing config"
          fi
          
          # Env ফাইল-এ HOST_CONFIG_PATH সেট করুন
          if [ -f .env ]; then
            # হোস্ট কনফিগ পাথ সেট করুন
            grep -q "^HOST_CONFIG_PATH=" .env && sed -i 's|^HOST_CONFIG_PATH=.*|HOST_CONFIG_PATH=/home/ubuntu/configs|' .env || echo "HOST_CONFIG_PATH=/home/ubuntu/configs" >> .env
            echo "✅ HOST_CONFIG_PATH set in .env"
          fi

      - name: "🏗️ Build New Image"
        run: |
          echo "🔨 Building new images..."
          DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker compose build --progress=plain

      - name: "🧹 Prune Docker build cache"
        if: always()
        run: |
          echo "🔍 Cleaning up old Docker builder cache..."
          docker builder prune --all --force || true
          sudo rm -rf /tmp/.buildx-cache || true

      - name: "🚢 Zero Downtime Deployment & Rollback"
        run: |
          # এনভায়রনমেন্ট ও ফাইল সেটআপ
          cp ~/newsmartagent.env .env || echo ".env file already in place"
          grep -q '^HOST_CONFIG_PATH=' .env && sed -i 's|^HOST_CONFIG_PATH=.*|HOST_CONFIG_PATH=/home/ubuntu/configs|' .env || echo 'HOST_CONFIG_PATH=/home/ubuntu/configs' >> .env
          
          mkdir -p /home/ubuntu/configs
          
          # service_account.json কপি করুন এবং সেট করুন
          if [ -d "$HOME/service_account.json" ]; then
            echo "⚠️  Found $HOME/service_account.json as a directory, expected a JSON file"
            json_files=$(find "$HOME/service_account.json" -maxdepth 1 -type f -name '*.json' | sort)
            if [ -n "$json_files" ]; then
              echo "ℹ️  JSON file(s) found inside the directory:"
              echo "$json_files"
              if [ "$(echo "$json_files" | wc -l)" -eq 1 ]; then
                cp "$(echo "$json_files" | head -n 1)" /home/ubuntu/configs/service_account.json
                echo "✅ Copied JSON file from directory to /home/ubuntu/configs/service_account.json"
              else
                echo "🚨 Multiple JSON files found inside $HOME/service_account.json; cannot determine which one to use"
                exit 1
              fi
            else
              echo "🚨 No JSON files found inside $HOME/service_account.json"
              exit 1
            fi
          elif [ -f "$HOME/service_account.json" ]; then
            cp "$HOME/service_account.json" /home/ubuntu/configs/service_account.json
            echo "✅ Service account prepared for deployment at /home/ubuntu/configs/"
          else
            echo "⚠️  Warning: $HOME/service_account.json not found"
          fi

          # HOST_CONFIG_PATH এনভায়রনমেন্টে এক্সপোর্ট করুন
          export HOST_CONFIG_PATH=/home/ubuntu/configs
          
          # gdrive_key.json ডিরেক্টরি ফাইনাল চেক - যদি ডিরেক্টরি থাকে সরিয়ে দিন
          if [ -d "jwtauth/gdrive_key.json" ]; then
            echo "🔍 Final check: Removing gdrive_key.json directory before docker compose up..."
            rm -rf jwtauth/gdrive_key.json
          fi

          # নিশ্চিত করুন ফাইল সিস্টেম ঠিক আছে
          echo "🔍 Pre-deployment validation:"
          if [ -e /home/ubuntu/configs/service_account.json ]; then
            if [ -d /home/ubuntu/configs/service_account.json ]; then
              echo "🚨 Error: /home/ubuntu/configs/service_account.json is a directory, expected a file"
              exit 1
            fi
            echo "✅ Service account file exists at /home/ubuntu/configs/"
            if file /home/ubuntu/configs/service_account.json | grep -q "JSON"; then
              echo "✅ Service account is valid JSON"
            else
              echo "⚠️  Warning: service_account.json is not valid JSON"
            fi
          else
            echo "🚨 Error: service_account.json missing at /home/ubuntu/configs/"
            exit 1
          fi

          echo "🔄 Deploying with Zero Downtime..."
          
          # ১. নতুন ইমেজ পুল করা
          docker compose pull
          
          # ২. নতুন কন্টেইনার চালু করা (পুরানোটা চালু রেখেই হেলথ চেক করবে)
          if ! docker compose up -d --build --remove-orphans; then
            echo "🚨 Deployment failed! Attempting to keep old services alive..."
            exit 1
          fi

          # ৩. হেলথ চেক: ভেরিয়েবল লোড করা এবং ১৫ সেকেন্ড অপেক্ষা করা
          PROJECT_NAME=$(grep '^PROJECT_NAME=' .env | head -n 1 | cut -d '=' -f2)
          echo "⏳ Waiting for services to stabilize for project: ${PROJECT_NAME}..."
          sleep 90
          
          # চেক করা হচ্ছে মেইন সার্ভিস (Django) রানিং কি না (grep safety added)
          if ! docker ps | grep -q -- "${PROJECT_NAME}-django"; then
            echo "❌ New version is not stable! Rolling back..."
            # রোলব্যাক লজিক: এখানে প্রয়োজনে আগের ইমেজ দিয়ে রিকভারি কমান্ড দেওয়া যায়
            exit 1
          else
            echo "🚀 NewSmartAgent is live and stable!"
          fi

      - name: "🌡️ Critical Health Verification"
        run: |
          echo "Verifying NSA system integrity..."
          # কন্টেইনারগুলো স্থির হতে সামান্য সময় দিন
          sleep 5

          PROJECT_NAME=$(grep '^PROJECT_NAME=' .env | head -n 1 | cut -d '=' -f2)

          # Verify Django backend (DB & Redis) internally with retry logic
          echo "Checking Django backend health..."
          success=false
          for i in 1 2 3 4 5; do
            echo "Attempt $i to check backend health..."
            if docker exec ${PROJECT_NAME}-django python3 << 'HEALTHCHECK'
              import urllib.request, json, sys, urllib.error
              try:
                  res = urllib.request.urlopen('http://localhost:8000/api/health/', timeout=10)
                  data = json.loads(res.read().decode())
                  status = data.get('status', '')
                  db = data.get('checks', {}).get('database', '')
                  redis = data.get('checks', {}).get('redis', '')
                  print(f'Status: {status}, DB: {db}, Redis: {redis}')
                  sys.exit(0 if status == 'ok' and db == 'ok' and redis == 'ok' else 1)
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code}: Still starting...')
                  sys.exit(1)
              except Exception as e:
                  print(f'Error: {e}')
                  sys.exit(1)
            HEALTHCHECK
             2>&1; then
              success=true
              break
            fi
            echo "Health check failed, retrying in 10 seconds..."
            sleep 10
          done
          if [ "$success" = false ]; then
            echo "🚨 Django backend health check failed after 5 attempts"
            echo "Checking container status..."
            docker ps | grep ${PROJECT_NAME}-django || echo "Django container not running!"
            docker logs --tail 50 ${PROJECT_NAME}-django || echo "Could not retrieve logs"
            exit 1
          fi

          # Verify Next.js frontend internally
          echo "Checking Next.js frontend health..."
          docker exec ${PROJECT_NAME}-nextjs node -e "
          const http = require('http');
          const req = http.get('http://localhost:3000/frontend-health', (res) => {
              if (res.statusCode === 200) {
                  console.log('Frontend is healthy');
                  process.exit(0);
              } else {
                  console.error('Frontend returned status code:', res.statusCode);
                  process.exit(1);
              }
          });
          req.on('error', (err) => {
              console.error('Error querying frontend:', err);
              process.exit(1);
          });
          " || (echo "🚨 Next.js frontend health check failed" && exit 1)

          echo "✅ All internal health checks passed successfully!"

      - name: "🧹 Post-Deployment Cleanup"
        if: always()
        run: |
          docker image prune -f
          echo "✨ Cleanup finished."
